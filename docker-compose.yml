services:
  vizitlink3d-api:
    build:
      context: .
      dockerfile: VizitLink3D.Api/Dockerfile
    container_name: vizitlink3d-api
    ports:
      - "5115:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - VIZITLINK3D_JWT_KEY=${VIZITLINK3D_JWT_KEY:-VizitLink3DGizliAnahtar2024!Guvenliyir#XYZ987}
      - VeriTabani__Yol=/app/Veri/vizitlink3d_v2.db
    volumes:
      - vizitlink3d_data_v2:/app/Veri
      - vizitlink3d_medya:/app/wwwroot/medya
    restart: unless-stopped

  vizitlink3d-ui:
    build:
      context: .
      dockerfile: VizitLink3D.UI/Dockerfile
    container_name: vizitlink3d-ui
    ports:
      - "5113:80"
    depends_on:
      - vizitlink3d-api
    restart: unless-stopped

volumes:
  vizitlink3d_data_v2:
  vizitlink3d_medya:
