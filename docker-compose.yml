services:
  vizitlink3d-api:
    image: uzunnet/goldbanyo-api:latest
    pull_policy: always
    container_name: vizitlink3d-api
    ports:
      - "5115:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - VIZITLINK3D_JWT_KEY=${VIZITLINK3D_JWT_KEY:-}
      - LisansAyarlari__GizliAnahtar=${VIZITLINK3D_LISANS_KEY:-}
      - VeriTabani__Yol=/app/Veri/vizitlink3d_v2.db
    volumes:
      - vizitlink3d_data_v2:/app/Veri
      - vizitlink3d_medya:/app/wwwroot/medya
    restart: unless-stopped

  vizitlink3d-ui:
    image: uzunnet/goldbanyo-ui:latest
    pull_policy: always
    container_name: vizitlink3d-ui
    ports:
      - "5113:80"
    depends_on:
      - vizitlink3d-api
    restart: unless-stopped

volumes:
  vizitlink3d_data_v2:
  vizitlink3d_medya:
