    <script>
        async function baslatBlazor() {
            if ('serviceWorker' in navigator) {
                var yerelGelisme = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
                if (yerelGelisme) {
                    try {
                        var kayitlar = await navigator.serviceWorker.getRegistrations();
                        await Promise.all(kayitlar.map(function(k) { return k.unregister(); }));
                        if ('caches' in window) {
                            var anahtarlar = await caches.keys();
                            await Promise.all(anahtarlar.map(function(a) { return caches.delete(a); }));
                        }
                    } catch (e) { /* yut */ }
                } else {
                    try { await navigator.serviceWorker.register('service-worker.js'); } catch (e) { /* yut */ }
                }
            }
            await Blazor.start();
        }
        baslatBlazor();
    </script>
