events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip sikistirma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/wasm application/json image/svg+xml;

    # Ek MIME tipleri (Blazor WASM)
    types {
        application/wasm wasm;
        application/octet-stream pdb;
        application/octet-stream dll;
        application/octet-stream dat;
        model/gltf-binary glb;
        model/gltf+json gltf;
        text/javascript js mjs;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Guvenlik header'lari
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' blob: data: http: https: ws: wss:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://youtube-nocookie.com https://www.google.com;" always;

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        location = /appsettings.json {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        # ornekdolap 3D Konfigurator — SPA fallback'ten bagimsiz
        location /goldbanyo/ {
            try_files  / =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location / {
            try_files  / /index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Clear-Site-Data '"cache"' always;
        }

        location = /_framework/blazor.webassembly.js {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location /_framework/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(js|css)$ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location ~* \.(png|jpg|svg|ico|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public";
        }

        location ~* \.(glb|gltf|hdr)$ {
            expires 90d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        location ^~ /medya/ {
            expires 30d;
            add_header Cache-Control "public";
            try_files  =404;
        }

        location /api/ {
            proxy_pass http://vizitlink3d-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
            proxy_set_header X-Real-IP ;
            proxy_set_header X-Forwarded-For ;
            proxy_set_header X-Forwarded-Proto ;
        }

        location /hubs/ {
            proxy_pass http://vizitlink3d-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade ;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
            proxy_set_header X-Real-IP ;
        }
    }
}