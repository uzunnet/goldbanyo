events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip sikistirma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/wasm application/json image/svg+xml;

    # Not: Brotli direktifleri kaldirildi — standart nginx:alpine imaji
    # ngx_brotli modulunu icermez, "brotli on;" nginx'i baslangicta cokertir.
    # Sikistirma icin yukaridaki "gzip on" yeterli (wasm/dll dahil).

    # Ek MIME tipleri (Blazor WASM)
    types {
        application/wasm wasm;
        application/octet-stream pdb;
        application/octet-stream dll;
        application/octet-stream dat;
        model/gltf-binary glb;
        model/gltf+json gltf;
        text/javascript js mjs;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Guvenlik header'lari (anayasa §3.2)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' blob: data: http: https: ws: wss:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://youtube-nocookie.com https://www.google.com;" always;

        # SPA fallback — tum route'lar index.html'e
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        location = /appsettings.json {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # _framework statik dosyalari (Blazor WASM) — uzun sureli cache
        location = /_framework/blazor.webassembly.js {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location /_framework/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Deploy sonrasi degisebilen kod ve stil dosyalari daima dogrulanir.
        location ~* \.(js|css)$ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Surumden bagimsiz diger statik varliklar
        location ~* \.(png|jpg|svg|ico|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public";
        }

        # 3D model dosyalari (GLB/GLTF) — uzun sureli cache
        location ~* \.(glb|gltf|hdr)$ {
            expires 90d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # Medya dosyalari (UI'nin kendi wwwroot/medya'sinda, yerelden sunulur —
        # API'nin wwwroot/medya'si bos, proxy'lemek 404 verirdi)
        location ^~ /medya/ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # API proxy (geliştirme / production)
        location /api/ {
            proxy_pass http://vizitlink3d-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SignalR hub proxy
        location /hubs/ {
            proxy_pass http://vizitlink3d-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
