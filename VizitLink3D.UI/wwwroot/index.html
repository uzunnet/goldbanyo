    <script>
        // PWA kapali (00_PROJE_BILGISI.md: PWA_Offline: false) - Service Worker kayit edilmez.
        // Eski (eski deploy'lardan kalan) SW'leri temizle.
        if ('serviceWorker' in navigator) {
            try {
                navigator.serviceWorker.getRegistrations().then(function(liste) {
                    liste.forEach(function(k) { k.unregister(); });
                });
                if ('caches' in window) {
                    caches.keys().then(function(anahtarlar) {
                        anahtarlar.forEach(function(a) { caches.delete(a); });
                    });
                }
            } catch (e) { /* yut */ }
        }
        async function baslatBlazor() {
            await Blazor.start();
        }
        baslatBlazor();
    </script>
