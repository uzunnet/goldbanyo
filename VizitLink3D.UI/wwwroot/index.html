    <!-- Blazor WASM Loader -->
    <script src="_framework/blazor.webassembly.js?v=20260704-3113-loaderfix-1" autostart="false"></script>
    <script>
        window.vizitlink3dWasmDestekleniyor = typeof window !== 'undefined'
            && typeof window.WebAssembly !== 'undefined'
            && typeof window.fetch !== 'undefined';

        async function eskiYuklemeleriTemizle() {
            // PWA kapali (00_PROJE_BILGI.md: PWA_Offline: false) - Service Worker kayit edilmez.
            // Eski deploy'lardan kalan SW ve cache'ler ilk boot'tan once temizlenir.
            try {
                if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
                    const kayitlar = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(kayitlar.map(function(kayit) { return kayit.unregister(); }));
                }
                if (typeof caches !== 'undefined' && 'keys' in caches) {
                    const anahtarlar = await caches.keys();
                    await Promise.all(anahtarlar.map(function(anahtar) { return caches.delete(anahtar); }));
                }
            } catch (e) { /* yut */ }
        }

        async function baslatBlazor() {
            if (!window.vizitlink3dWasmDestekleniyor) {
                return;
            }
            // Not: cache-busting icin manuel '?v=' sorgu dizesi eklemeyin.
            // Blazor her framework dosyasini icerik hash'i ile fingerprint'ler
            // (orn. VizitLink3D.UI.1flnmdrlzj.wasm) - bu zaten otomatik cache-busting saglar.
            // Manuel query-string eklemek, ana assembly icin preload/fetch URL uyusmazligina
            // ve 404/net::ERR_ABORTED hatasina yol acmisti.
            await eskiYuklemeleriTemizle();
            await Blazor.start();
        }
        baslatBlazor();
    </script>
