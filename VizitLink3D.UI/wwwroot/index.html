    <!-- Blazor WASM Loader -->
    <script src="_framework/blazor.webassembly.js?v=20260719-pwa-install-4" autostart="false"></script>
    <script>
        window.vizitlink3dWasmDestekleniyor = typeof window !== 'undefined'
            && typeof window.WebAssembly !== 'undefined'
            && typeof window.fetch !== 'undefined';

        async function eskiYuklemeleriTemizle() {
            // PWA kapali (00_PROJE_BILGI.md: PWA_Offline: false) - Service Worker kayit edilmez.
            // Eski deploy'lardan kalan SW ve cache'ler ilk boot'tan once temizlenir.
            try {
                const tekrarYukleAnahtari = 'vizitlink3d-sw-temizleme-pwa-4';
                const eskiWorkerEtkin = typeof navigator !== 'undefined'
                    && 'serviceWorker' in navigator
                    && navigator.serviceWorker.controller
                    && sessionStorage.getItem(tekrarYukleAnahtari) !== 'tamam';

                if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
                    const kayitlar = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(kayitlar.map(function(kayit) { return kayit.unregister(); }));
                }
                if (typeof caches !== 'undefined' && 'keys' in caches) {
                    const anahtarlar = await caches.keys();
                    await Promise.all(anahtarlar.map(function(anahtar) { return caches.delete(anahtar); }));
                }
                if (eskiWorkerEtkin) {
                    sessionStorage.setItem(tekrarYukleAnahtari, 'tamam');
                    window.location.reload();
                    return true;
                }
            } catch (e) { /* yut */ }

            return false;
        }

        async function baslatBlazor() {
            if (!window.vizitlink3dWasmDestekleniyor) {
                return;
            }
            // Not: cache-busting icin manuel '?v=' sorgu dizesi eklemeyin.
            // Blazor her framework dosyasini icerik hash'i ile fingerprint'ler
            // (orn. VizitLink3D.UI.1flnmdrlzj.wasm) - bu zaten otomatik cache-busting saglar.
            // Manuel query-string eklemek, ana assembly icin preload/fetch URL uyusmazligina
            // ve 404/net::ERR_ABORTED hatasina yol acmisti.
            if (await eskiYuklemeleriTemizle()) {
                return;
            }
            await Blazor.start();
        }
        baslatBlazor();
    </script>

    <!-- PWA Install Prompt — mobilde her durumda gosterilir -->
    <script>
        (function() {
            // Sadece mobil genislik (<= 760px)
            if (window.innerWidth > 760) return;
            // Standalone (zaten yuklu PWA) ise gosterme
            if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) return;
            // Kullanici daha once kapattiysa gosterme
            try { if (localStorage.getItem('goldbanyo_pwa_install_kapatildi')) return; } catch(e) { return; }

            var deferredPrompt = null;

            // 1) beforeinstallprompt gelirse native PWA akisi
            window.addEventListener('beforeinstallprompt', function(e) {
                e.preventDefault();
                deferredPrompt = e;
                bannerOlustur(true);
            });

            // 2) beforeinstallprompt gelmese de 1200ms sonra banner goster
            function mobilBannerGecikmeli() {
                setTimeout(function() {
                    if (document.getElementById('gb-pwa-banner')) return;
                    bannerOlustur(false);
                }, 1200);
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', mobilBannerGecikmeli);
            } else {
                mobilBannerGecikmeli();
            }

            function bannerOlustur(promptVarMi) {
                if (document.getElementById('gb-pwa-banner')) return;

                var b = document.createElement('div');
                b.id = 'gb-pwa-banner';
                b.style.cssText = [
                    'position:fixed',
                    'bottom:0',
                    'left:0',
                    'right:0',
                    'z-index:9998',
                    'padding:12px 16px',
                    'padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))',
                    'background:var(--tema-yuzey,#111)',
                    'border-top:1px solid rgba(255,255,255,0.08)',
                    'display:flex',
                    'flex-wrap:wrap',
                    'align-items:center',
                    'justify-content:space-between',
                    'gap:8px',
                    'font-family:"Roboto",Arial,sans-serif',
                    'backdrop-filter:blur(12px)',
                    '-webkit-backdrop-filter:blur(12px)'
                ].join(';') + ';';

                // Metin
                var m = document.createElement('span');
                if (promptVarMi) {
                    m.textContent = "Gold Banyo'yu telefonunuza ekleyin, tek dokunu\u015fla a\u00e7\u0131n.";
                } else {
                    m.textContent = "Kurulum i\u00e7in Chrome men\u00fcs\u00fcnden \u22ee &gt; Ana ekrana ekle se\u00e7ene\u011fini kullan\u0131n.";
                }
                m.style.cssText = 'flex:1;min-width:160px;font-size:0.82rem;line-height:1.4;color:var(--tema-metin,#fff);opacity:0.92;';
                b.appendChild(m);

                // Ana buton
                var btnEkle = document.createElement('button');
                btnEkle.textContent = promptVarMi ? "Telefona Ekle" : "Anlad\u0131m";
                btnEkle.style.cssText = [
                    'padding:8px 18px',
                    'border:none',
                    'border-radius:var(--tema-kose-sm,4px)',
                    'background:var(--tema-vurgu,#FFD700)',
                    'color:#0a0a0a',
                    'font-size:0.78rem',
                    'font-weight:600',
                    'cursor:pointer',
                    'white-space:nowrap',
                    'letter-spacing:0.02em'
                ].join(';') + ';';

                btnEkle.addEventListener('click', async function() {
                    if (deferredPrompt) {
                        try {
                            await deferredPrompt.prompt();
                            await deferredPrompt.userChoice;
                            deferredPrompt = null;
                        } catch(_) { /* prompt iptal */ }
                    }
                    try { localStorage.setItem('goldbanyo_pwa_install_kapatildi', 'tamam'); } catch(_) {}
                    if (b.parentNode) b.parentNode.removeChild(b);
                });
                b.appendChild(btnEkle);

                // Ikincil buton (sadece prompt var ise — yoksa yonerge yeterli)
                if (promptVarMi) {
                    var btnSonra = document.createElement('button');
                    btnSonra.textContent = "Daha sonra";
                    btnSonra.style.cssText = [
                        'padding:8px 12px',
                        'border:none',
                        'border-radius:var(--tema-kose-sm,4px)',
                        'background:transparent',
                        'color:var(--tema-metin,#fff)',
                        'font-size:0.74rem',
                        'opacity:0.6',
                        'cursor:pointer',
                        'white-space:nowrap'
                    ].join(';') + ';';
                    btnSonra.addEventListener('click', function() {
                        try { localStorage.setItem('goldbanyo_pwa_install_kapatildi', 'tamam'); } catch(_) {}
                        if (b.parentNode) b.parentNode.removeChild(b);
                    });
                    b.appendChild(btnSonra);
                }

                document.body.appendChild(b);
            }
        })();
    </script>
