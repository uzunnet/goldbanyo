    <!-- Blazor WASM Loader -->
    <script src="_framework/blazor.webassembly.js?v=20260719-mobil-web-1" autostart="false"></script>
    <script>
        window.vizitlink3dWasmDestekleniyor = typeof window !== 'undefined'
            && typeof window.WebAssembly !== 'undefined'
            && typeof window.fetch !== 'undefined';

        async function eskiYuklemeleriTemizle() {
            // PWA kapali (00_PROJE_BILGI.md: PWA_Offline: false) - Service Worker kayit edilmez.
            // Eski deploy'lardan kalan SW ve cache'ler ilk boot'tan once temizlenir.
            try {
                const tekrarYukleAnahtari = 'vizitlink3d-sw-temizleme-web-1';
                const eskiWorkerEtkin = typeof navigator !== 'undefined'
                    && 'serviceWorker' in navigator
                    && navigator.serviceWorker.controller
                    && sessionStorage.getItem(tekrarYukleAnahtari) !== 'tamam';

                if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
                    const kayitlar = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(kayitlar.map(function(kayit) { return kayit.unregister(); }));
                }
                if (typeof caches !== 'undefined' && 'keys' in caches) {
                    const anahtarlar = await caches.keys();
                    await Promise.all(anahtarlar.map(function(anahtar) { return caches.delete(anahtar); }));
                }
                if (eskiWorkerEtkin) {
                    sessionStorage.setItem(tekrarYukleAnahtari, 'tamam');
                    window.location.reload();
                    return true;
                }
            } catch (e) { /* yut */ }

            return false;
        }

        async function baslatBlazor() {
            if (!window.vizitlink3dWasmDestekleniyor) {
                return;
            }
            // Not: cache-busting icin manuel '?v=' sorgu dizesi eklemeyin.
            // Blazor her framework dosyasini icerik hash'i ile fingerprint'ler
            // (orn. VizitLink3D.UI.1flnmdrlzj.wasm) - bu zaten otomatik cache-busting saglar.
            // Manuel query-string eklemek, ana assembly icin preload/fetch URL uyusmazligina
            // ve 404/net::ERR_ABORTED hatasina yol acmisti.
            if (await eskiYuklemeleriTemizle()) {
                return;
            }
            await Blazor.start();
        }
        baslatBlazor();
    </script>

    <!-- Mobil bilgilendirme banneri: web modunda mobilde uygulama kisa yolu onerisi -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var mobilKontrol = window.matchMedia('(max-width: 760px)').matches;
            var standaloneMod = window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone;

            if (!mobilKontrol || standaloneMod) return;
            if (localStorage.getItem('goldbanyo_mobil_web_bilgi_kapatildi')) return;

            var banner = document.createElement('div');
            banner.id = 'gb-mobil-bilgi-banneri';
            banner.innerHTML = '<span id="gb-mobil-bilgi-metni">Mobil web görünümündesiniz. İsterseniz menüden uygulama gibi kısayol ekleyebilirsiniz.</span>'

            banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:99999;'
                + 'display:flex;align-items:center;justify-content:space-between;gap:12px;'
                + 'padding:14px 16px;'
                + 'background:var(--tema-yuzey,#111);color:var(--tema-metin,#fff);'
                + 'border-top:1px solid var(--tema-cam-cizgi,rgba(255,255,255,0.10));'
                + 'font-size:0.82rem;line-height:1.4;box-shadow:0 -4px 20px rgba(0,0,0,0.4);';

            document.body.appendChild(banner);

            document.getElementById('gb-mobil-bilgi-buton').addEventListener('click', function() {
                localStorage.setItem('goldbanyo_mobil_web_bilgi_kapatildi', 'true');
                if (banner.parentNode) banner.parentNode.removeChild(banner);
            });
        });
    </script>
