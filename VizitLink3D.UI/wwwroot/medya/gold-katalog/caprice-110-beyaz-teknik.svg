<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .title { font-size: 18px; font-weight: bold; fill: #1a1a2e; }
      .subtitle { font-size: 13px; fill: #555; }
      .dim-line { stroke: #2563eb; stroke-width: 1; fill: none; }
      .dim-arrow { fill: #2563eb; }
      .dim-text { font-size: 11px; fill: #2563eb; font-weight: bold; text-anchor: middle; }
      .cabinet-fill { fill: #f0f0f5; stroke: #1a1a2e; stroke-width: 2; }
      .cabinet-fill-light { fill: #f8f8fc; stroke: #1a1a2e; stroke-width: 1.5; }
      .mirror-fill { fill: #e8f4fd; stroke: #1a1a2e; stroke-width: 2; }
      .mirror-fill-light { fill: #f0f8ff; stroke: #1a1a2e; stroke-width: 1.5; }
      .mirror-glass { fill: #d6edff; stroke: #8ec5fc; stroke-width: 0.8; }
      .marble-fill { fill: #e8e4db; stroke: #1a1a2e; stroke-width: 2; }
      .marble-vein { stroke: #d4cfc4; stroke-width: 0.6; fill: none; }
      .detail-line { stroke: #999; stroke-width: 0.8; stroke-dasharray: 3,3; fill: none; }
      .label-text { font-size: 10px; fill: #333; text-anchor: middle; }
      .part-label { font-size: 11px; fill: #1a1a2e; font-weight: bold; text-anchor: middle; }
      .section-title { font-size: 14px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
      .grid-line { stroke: #e5e7eb; stroke-width: 0.5; stroke-dasharray: 2,4; fill: none; }
    </style>
  </defs>

  <!-- Arkaplan -->
  <rect class="bg" x="0" y="0" width="900" height="700" rx="4"/>

  <!-- Başlık -->
  <text x="450" y="30" class="title" text-anchor="middle">Caprice 110 Beyaz — Teknik Çizim</text>
  <text x="450" y="48" class="subtitle" text-anchor="middle">Gold Ban-Yom Exclusive Serisi | Banyo Dolabı</text>

  <!-- ===== ÖN GÖRÜNÜM (Front View) ===== -->
  <text x="225" y="72" class="section-title">ÖN GÖRÜNÜM</text>

  <!-- Izgara -->
  <line x1="40" y1="80" x2="410" y2="80" class="grid-line"/>
  <line x1="40" y1="200" x2="410" y2="200" class="grid-line"/>
  <line x1="40" y1="340" x2="410" y2="340" class="grid-line"/>
  <line x1="130" y1="80" x2="130" y2="360" class="grid-line"/>
  <line x1="225" y1="80" x2="225" y2="360" class="grid-line"/>
  <line x1="320" y1="80" x2="320" y2="360" class="grid-line"/>

  <!-- Ayna Ünitesi (Ön görünüm: 55cm genişlik, 85cm yükseklik) -->
  <!-- Ayna kutusu -->
  <rect x="87" y="85" width="275" height="250" class="mirror-fill" rx="3"/>
  <!-- Ayna yüzeyi -->
  <rect x="97" y="95" width="255" height="230" class="mirror-glass" rx="2"/>
  <!-- Ayna parlaması -->
  <line x1="110" y1="100" x2="140" y2="130" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="115" y1="100" x2="135" y2="120" stroke="#fff" stroke-width="1.5" opacity="0.4"/>

  <!-- LED aydınlatma şeridi -->
  <rect x="87" y="325" width="275" height="6" fill="#ffd700" rx="1" opacity="0.8"/>

  <!-- Dolap/Lavabo Ünitesi (Ön görünüm: 110cm genişlik, 55cm yükseklik) -->
  <rect x="47" y="340" width="355" height="145" class="cabinet-fill" rx="3"/>
  
  <!-- Kapak çizgileri -->
  <line x1="180" y1="345" x2="180" y2="480" class="detail-line"/>
  <line x1="268" y1="345" x2="268" y2="480" class="detail-line"/>

  <!-- Kulplar -->
  <rect x="222" y="400" width="6" height="30" fill="#888" rx="3"/>
  <rect x="222" y="345" width="6" height="30" fill="#888" rx="3"/>

  <!-- Rölyef desen çizgileri -->
  <rect x="190" y="355" width="70" height="115" fill="none" stroke="#ccc" stroke-width="0.5" rx="2"/>
  <rect x="282" y="355" width="70" height="115" fill="none" stroke="#ccc" stroke-width="0.5" rx="2"/>
  <line x1="195" y1="365" x2="255" y2="365" class="detail-line"/>
  <line x1="195" y1="375" x2="255" y2="375" class="detail-line"/>
  <line x1="195" y1="385" x2="255" y2="385" class="detail-line"/>

  <!-- Mermer tezgah -->
  <rect x="47" y="330" width="355" height="14" class="marble-fill" rx="2"/>
  <line x1="80" y1="333" x2="120" y2="337" class="marble-vein"/>
  <line x1="200" y1="334" x2="260" y2="338" class="marble-vein"/>
  <line x1="300" y1="332" x2="350" y2="336" class="marble-vein"/>

  <!-- Ölçü çizgileri - Genişlik -->
  <!-- Üst genişlik ölçüsü -->
  <line x1="47" y1="78" x2="47" y2="335" class="dim-line"/>
  <line x1="402" y1="78" x2="402" y2="335" class="dim-line"/>
  <line x1="47" y1="73" x2="402" y2="73" class="dim-line"/>
  <polygon points="47,70 55,73 47,76" class="dim-arrow"/>
  <polygon points="402,70 394,73 402,76" class="dim-arrow"/>
  <text x="224" y="70" class="dim-text">110 cm</text>

  <!-- Ayna genişlik -->
  <line x1="87" y1="80" x2="87" y2="88" class="dim-line"/>
  <line x1="362" y1="80" x2="362" y2="88" class="dim-line"/>
  <line x1="87" y1="83" x2="362" y2="83" class="dim-line"/>
  <polygon points="87,80 95,83 87,86" class="dim-arrow"/>
  <polygon points="362,80 354,83 362,86" class="dim-arrow"/>
  <text x="224" y="82" class="dim-text">55 cm</text>

  <!-- Ayna yükseklik ölçüsü -->
  <line x1="370" y1="85" x2="420" y2="85" class="dim-line"/>
  <line x1="420" y1="85" x2="420" y2="335" class="dim-line"/>
  <line x1="370" y1="335" x2="420" y2="335" class="dim-line"/>
  <polygon points="417,85 420,93 423,85" class="dim-arrow"/>
  <polygon points="417,335 420,327 423,335" class="dim-arrow"/>
  <text x="430" y="215" class="dim-text" text-anchor="middle" transform="rotate(90,430,215)">85 cm</text>

  <!-- Dolap yükseklik ölçüsü -->
  <line x1="370" y1="340" x2="420" y2="340" class="dim-line"/>
  <line x1="420" y1="340" x2="420" y2="485" class="dim-line"/>
  <line x1="370" y1="485" x2="420" y2="485" class="dim-line"/>
  <polygon points="417,340 420,348 423,340" class="dim-arrow"/>
  <polygon points="417,485 420,477 423,485" class="dim-arrow"/>
  <text x="430" y="418" class="dim-text" text-anchor="middle" transform="rotate(90,430,418)">55 cm</text>

  <!-- Parça etiketleri -->
  <text x="224" y="505" class="part-label">Lavabo Ünitesi</text>
  <text x="224" y="518" class="label-text">110 cm × 55 cm × 46 cm</text>
  <text x="224" y="210" class="part-label">Ayna Ünitesi</text>
  <text x="224" y="223" class="label-text">55 cm × 85 cm × 6 cm</text>

  <!-- ===== YAN GÖRÜNÜM (Side View) ===== -->
  <text x="675" y="72" class="section-title">YAN GÖRÜNÜM (Sağdan)</text>

  <!-- Izgara -->
  <line x1="520" y1="80" x2="520" y2="500" class="grid-line"/>
  <line x1="580" y1="80" x2="580" y2="500" class="grid-line"/>
  <line x1="640" y1="80" x2="640" y2="500" class="grid-line"/>
  <line x1="700" y1="80" x2="700" y2="500" class="grid-line"/>

  <!-- Ayna (yan görünüm: 6cm derinlik x 85cm yükseklik) -->
  <rect x="555" y="85" width="30" height="250" class="mirror-fill" rx="2"/>
  <rect x="558" y="88" width="24" height="244" class="mirror-glass" rx="1"/>
  <line x1="560" y1="92" x2="562" y2="96" stroke="#fff" stroke-width="1.5" opacity="0.6"/>

  <!-- LED ışık profili -->
  <rect x="553" y="325" width="34" height="6" fill="#ffd700" rx="1" opacity="0.8"/>

  <!-- Dolap (yan görünüm: 46cm derinlik x 55cm yükseklik) -->
  <rect x="540" y="340" width="60" height="145" class="cabinet-fill" rx="2"/>
  <!-- Kapak (yan görünüm) -->
  <rect x="540" y="340" width="8" height="145" fill="#e0e0e8" stroke="#1a1a2e" stroke-width="1.5" rx="1"/>
  <!-- Mermer tezgah profili -->
  <rect x="537" y="330" width="65" height="14" class="marble-fill" rx="2"/>
  <line x1="550" y1="333" x2="580" y2="337" class="marble-vein"/>
  <!-- Dolap gövde -->
  <rect x="548" y="340" width="52" height="145" fill="#e8e8f0" stroke="#1a1a2e" stroke-width="1"/>

  <!-- Duvar bağlantısı -->
  <line x1="525" y1="85" x2="525" y2="500" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="522" y="510" class="label-text">Duvar</text>

  <!-- Ölçü çizgileri - Derinlik -->
  <!-- Üst derinlik -->
  <line x1="540" y1="520" x2="540" y2="500" class="dim-line"/>
  <line x1="600" y1="520" x2="600" y2="500" class="dim-line"/>
  <line x1="540" y1="520" x2="600" y2="520" class="dim-line"/>
  <polygon points="540,517 548,520 540,523" class="dim-arrow"/>
  <polygon points="600,517 592,520 600,523" class="dim-arrow"/>
  <text x="570" y="515" class="dim-text">46 cm</text>

  <!-- Ayna derinlik -->
  <line x1="525" y1="200" x2="555" y2="200" class="dim-line"/>
  <line x1="525" y1="200" x2="525" y2="210" class="dim-line"/>
  <polygon points="525,205 530,200 525,197" class="dim-arrow"/>
  <polygon points="555,205 550,200 555,197" class="dim-arrow"/>
  <text x="540" y="196" class="dim-text">6 cm</text>

  <!-- Toplam yükseklik -->
  <line x1="615" y1="85" x2="640" y2="85" class="dim-line"/>
  <line x1="640" y1="85" x2="640" y2="485" class="dim-line"/>
  <line x1="615" y1="485" x2="640" y2="485" class="dim-line"/>
  <polygon points="637,85 640,93 643,85" class="dim-arrow"/>
  <polygon points="637,485 640,477 643,485" class="dim-arrow"/>
  <text x="650" y="290" class="dim-text" text-anchor="middle" transform="rotate(90,650,290)">85 cm (Toplam)</text>

  <!-- Parça etiketleri - yan -->
  <text x="655" y="421" class="part-label" text-anchor="start">Lavabo Ünitesi</text>
  <text x="655" y="434" class="label-text" text-anchor="start">110 × 85 × 46 cm</text>
  <text x="655" y="205" class="part-label" text-anchor="start">Ayna Ünitesi</text>
  <text x="655" y="218" class="label-text" text-anchor="start">55 × 85 × 6 cm</text>

  <!-- ===== AÇIKLAMA KUTUSU ===== -->
  <rect x="50" y="545" width="800" height="130" fill="#f4f4f9" stroke="#ddd" stroke-width="1" rx="6"/>
  <text x="70" y="568" class="part-label" text-anchor="start">Malzeme / Kaplama Bilgisi</text>
  
  <circle cx="80" cy="585" r="4" fill="#2563eb"/>
  <text x="92" y="589" class="label-text" text-anchor="start">Mermer Tezgah: Doğal mermer görünümlü, leke tutmaz yüzey kaplama</text>
  
  <circle cx="80" cy="605" r="4" fill="#2563eb"/>
  <text x="92" y="609" class="label-text" text-anchor="start">Lake Boya: Suya ve neme dayanıklı, mat saten yüzeyli özel lake kaplama</text>
  
  <circle cx="80" cy="625" r="4" fill="#2563eb"/>
  <text x="92" y="629" class="label-text" text-anchor="start">Rölyef Desen: Kapak yüzeyinde üç boyutlu kabartma dekoratif desen</text>
  
  <circle cx="80" cy="645" r="4" fill="#2563eb"/>
  <text x="92" y="649" class="label-text" text-anchor="start">LED Aydınlatma: Ayna ünitesinde enerji tasarruflu, 4000K doğal beyaz ışık şeridi</text>

  <circle cx="450" cy="585" r="4" fill="#2563eb"/>
  <text x="462" y="589" class="label-text" text-anchor="start">Dokunmatik Aç/Kapa: Ayna ünitesinde sensörlü dokunmatik açma/kapama mekanizması</text>
  
  <circle cx="450" cy="605" r="4" fill="#2563eb"/>
  <text x="462" y="609" class="label-text" text-anchor="start">Gövde: 18 mm suya dayanıklı MDF + özel neme dayanıklı kenar bandı</text>
  
  <circle cx="450" cy="625" r="4" fill="#2563eb"/>
  <text x="462" y="629" class="label-text" text-anchor="start">Menteşe: Sessiz kapanma sistemli, ayarlanabilir metal menteşeler</text>
  
  <circle cx="450" cy="645" r="4" fill="#2563eb"/>
  <text x="462" y="649" class="label-text" text-anchor="start">Kulp: Özel tasarım metal kulp, krom/nikel kaplama</text>
</svg>